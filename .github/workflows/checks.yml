name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check supabase/functions/analyze-pokemon-card/index.ts supabase/functions/generate-set-cards/index.ts supabase/functions/translate/index.ts supabase/functions/pokemon-proxy/index.ts
