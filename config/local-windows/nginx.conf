server {
  listen 8080;
  server_name localhost 127.0.0.1;
  if ($host !~ ^(localhost|127\.0\.0\.1|web)$) { return 444; }
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /healthz {
    default_type application/json;
    add_header Cache-Control no-store;
    return 200 '{"status":"ok","hosting":"local"}';
  }
  location ^~ /backend/auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 60s;
    add_header Cache-Control no-store always;
  }
  location ^~ /backend/rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control no-store always;
  }
  location ^~ /backend/functions/v1/ {
    proxy_pass http://functions:9000/;
    proxy_set_header Host $host;
    proxy_read_timeout 65s;
    add_header Cache-Control no-store always;
  }
  location /backend { return 404; }
  location ~ /\. { return 404; }
  location = /index.html { add_header Cache-Control no-cache; }
  location = /sw.js { add_header Cache-Control no-cache; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
